name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Brussels   # makes the DST test meaningful
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Type-check the API
        run: bun run typecheck:api
      - name: API tests (against demo-vault/)
        run: bun run test
      - name: Build the front
        run: bun run build
